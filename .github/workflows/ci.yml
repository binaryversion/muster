name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [mcp-server, backend, channel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # The shared module is copied into each package rather than depended on,
      # because each Dockerfile's build context is its own directory. Drift
      # means leads authenticating against one service and not the other.
      - name: generated copies match packages/shared
        run: ./scripts/sync-shared.sh --check
      - run: npm ci
        working-directory: packages/${{ matrix.pkg }}
      - run: npm run build
        working-directory: packages/${{ matrix.pkg }}
      - name: unit tests
        working-directory: packages/${{ matrix.pkg }}
        # Only the backend defines tests so far; skip quietly elsewhere.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "no test script for ${{ matrix.pkg }}"
          fi

  smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: muster
          POSTGRES_PASSWORD: muster
          POSTGRES_DB: muster
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U muster"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://muster:muster@localhost:5432/muster
      ADMIN_PASSWORD: ci-admin-password
      ENC_KEY: Y2ktZW5jLWtleS10aGlydHktdHdvLWJ5dGVzLW1pbmltdW0=
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
      GITHUB_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/migrate.sh
      - name: build and start the stack
        run: |
          for pkg in backend mcp-server; do
            (cd "packages/$pkg" && npm ci && npm run build)
          done
          (cd packages/backend    && node dist/index.js &)
          (cd packages/mcp-server && node dist/index.js &)
          for _ in $(seq 1 30); do
            curl -sf localhost:8080/healthz >/dev/null && curl -sf localhost:8090/healthz >/dev/null && exit 0
            sleep 1
          done
          echo "servers did not come up" >&2; exit 1
      - run: ./scripts/smoke.sh

  # The one thing the development environment could not check: that the images
  # build and that the stack actually comes up from the compose file. Runners
  # can pull from Docker Hub, so this is where it gets verified — on every push,
  # rather than once by hand.
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      ADMIN_PASSWORD: ci-admin-password
      ENC_KEY: Y2ktZW5jLWtleS10aGlydHktdHdvLWJ5dGVzLW1pbmltdW0=
      GITHUB_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4

      # --wait blocks until the healthchecks pass, so a container that starts
      # and immediately falls over fails here rather than in the smoke run.
      # Naming the two services waits on those healthchecks specifically; db and
      # the one-shot migrate still run as their dependencies.
      - name: build the images and bring the stack up
        run: docker compose up -d --build --wait backend mcp-server

      - name: the migration service ran and exited cleanly
        run: |
          cid=$(docker compose ps -aq migrate)
          code=$(docker inspect -f '{{.State.ExitCode}}' "$cid")
          echo "migrate exited $code"
          [ "$code" = "0" ]

      - name: the containers do not run as root
        run: |
          for svc in backend mcp-server; do
            user=$(docker compose exec -T "$svc" id -un)
            echo "$svc runs as $user"
            [ "$user" != "root" ]
          done

      - name: smoke test against the containers
        env:
          DATABASE_URL: postgres://muster:ci-postgres-password@localhost:5432/muster
        run: ./scripts/smoke.sh

      - name: container logs
        if: failure()
        run: docker compose logs --no-color

      - name: tear down
        if: always()
        run: docker compose down -v

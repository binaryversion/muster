services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
      POSTGRES_DB: muster
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/store/migrations:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./packages/backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://muster:muster@db:5432/muster
    ports: ["8080:8080"]
    depends_on: [db]

  mcp-server:
    build: ./packages/mcp-server
    env_file: .env
    environment:
      DATABASE_URL: postgres://muster:muster@db:5432/muster
    ports: ["8090:8090"]
    depends_on: [db]

volumes:
  pgdata:
